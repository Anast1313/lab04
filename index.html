<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Привет, мир!</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', 'Roboto', sans-serif;
        background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #533483);
        background-size: 400% 400%;
        animation: gradientShift 15s ease infinite;
        overflow: hidden;
        position: relative;
      }

      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* Плавающие декоративные круги на фоне */
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.5;
        animation: float 12s ease-in-out infinite;
      }

      .orb:nth-child(1) {
        width: 300px;
        height: 300px;
        background: #e94560;
        top: -100px;
        left: -100px;
      }

      .orb:nth-child(2) {
        width: 400px;
        height: 400px;
        background: #0f3460;
        bottom: -150px;
        right: -150px;
        animation-delay: -4s;
      }

      .orb:nth-child(3) {
        width: 250px;
        height: 250px;
        background: #f5a623;
        top: 50%;
        left: 70%;
        animation-delay: -8s;
      }

      @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(40px, -40px) scale(1.1); }
        66% { transform: translate(-30px, 30px) scale(0.95); }
      }

      .card {
        position: relative;
        z-index: 2;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        padding: 60px 80px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1);
        transition: transform 0.4s ease, box-shadow 0.4s ease;
      }

      .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 30px 80px rgba(233, 69, 96, 0.3);
      }

      @keyframes cardAppear {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      h1 {
        font-size: clamp(2.5rem, 6vw, 4.5rem);
        font-weight: 800;
        background: linear-gradient(90deg, #ffffff, #f5a623, #e94560, #ffffff);
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 4s linear infinite;
        letter-spacing: 2px;
        margin-bottom: 8px;
        line-height: 1.2;
      }

      @keyframes shine {
        to { background-position: 300% 0; }
      }

      .subtitle {
        color: rgba(255, 255, 255, 0.6);
        font-size: 1rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 40px;
        animation: fadeIn 1.5s ease 0.3s both;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .logo-wrap {
        display: inline-block;
        padding: 20px 30px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.95);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
        animation: fadeIn 1.5s ease 0.5s both;
      }

      .logo-wrap:hover {
        transform: scale(1.08) rotate(-2deg);
        box-shadow: 0 15px 40px rgba(245, 166, 35, 0.5);
      }

      .logo-wrap img {
        display: block;
        height: 60px;
        width: auto;
      }

      /* Бегущая строка внизу */
      .marquee {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(10px);
        padding: 12px 0;
        z-index: 2;
      }

      .marquee-track {
        display: flex;
        white-space: nowrap;
        animation: scroll 20s linear infinite;
        color: rgba(255, 255, 255, 0.35);
        font-size: 0.85rem;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      .marquee-track span {
        padding: 0 40px;
      }

      @keyframes scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }

      @media (max-width: 600px) {
        .card { padding: 40px 30px; }
        .logo-wrap img { height: 40px; }
      }
    </style>
  </head>
  <body>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>

    <main class="card">
      <h1>Привет, мир!</h1>
      <p class="subtitle">Добро пожаловать</p>
      <a href="https://rb.asu.ru" target="_blank" rel="noopener" class="logo-wrap">
        <img src="https://rb.asu.ru/public/design/images/logotype/logoRI-2017.png" alt="Логотип РИ АГУ"/>
      </a>
    </main>

    <div class="marquee">
      <div class="marquee-track">
        <span>✦ Привет мир ✦</span>
        <span>✦ HTML ✦ CSS ✦ Анимация ✦</span>
        <span>✦ Привет мир ✦</span>
        <span>✦ HTML ✦ CSS ✦ Анимация ✦</span>
        <span>✦ Привет мир ✦</span>
        <span>✦ HTML ✦ CSS ✦ Анимация ✦</span>
        <span>✦ Привет мир ✦</span>
        <span>✦ HTML ✦ CSS ✦ Анимация ✦</span>
      </div>
    </div>
  </body>
</html>
